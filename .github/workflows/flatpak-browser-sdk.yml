name: Exact Flatpak Browser SDK candidate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this qualified exact Flatpak SDK as an immutable candidate
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install producer tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree xvfb xauth patchelf python3
      - name: Install exact official Flatpak commits in the ephemeral runner
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          python3 - <<'PY'
          import json, subprocess
          stack = json.load(open('release/flatpak-stack.lock.json'))
          for item in stack['flatpak'].values():
              subprocess.run(['flatpak', 'install', '--user', '--noninteractive', 'flathub', item['ref']], check=True)
              subprocess.run(['flatpak', 'update', '--user', '--noninteractive', '--commit=' + item['commit'], item['ref']], check=True)
          PY
      - name: Validate exact profile and immutable publisher gates
        run: python3 -B -m unittest discover -s release/tests -v
      - name: Bootstrap committed Dockpipe pin
        run: python3 .github/scripts/bootstrap-browser-cli.py
      - name: Build, install and qualify the exact Flatpak SDK
        env:
          SPATIAL_WEB_FLATPAK_OUTPUT: ${{ runner.temp }}/flatpak-browser
        run: dockpipe --workflow-file workflows/sdk.flatpak/config.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flatpak-browser-sdk
          path: ${{ runner.temp }}/flatpak-browser/candidate/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flatpak-browser-qualification
          path: |
            ${{ runner.temp }}/flatpak-browser/qualification.json
            ${{ runner.temp }}/flatpak-browser/installed-runtime-proof.json
            ${{ runner.temp }}/flatpak-browser/native/Testing/Temporary/LastTest.log
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: flatpak-browser-sdk
          path: ${{ runner.temp }}/candidate
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            ${{ runner.temp }}/candidate/*.tar.gz
            ${{ runner.temp }}/candidate/*.release.json
            ${{ runner.temp }}/candidate/*.files.json
      - name: Publish and read back the immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B release/publish-flatpak-browser-sdk.py --directory "$RUNNER_TEMP/candidate"
